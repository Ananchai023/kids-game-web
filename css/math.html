<!DOCTYPE html>
<!-- เกมคิดเลขเร็ว - บวก ลบ คูณ พร้อมเลือกระดับ มีเวลาและชีวิต -->
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เกมคิดเลขเร็ว ➕</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="game-page">

  <a class="back-btn" href="../index.html">⬅ กลับหน้าเมนู</a>
  <h1 class="game-title">➕ เกมคิดเลขเร็ว</h1>

  <!-- ===== หน้าตั้งค่า ===== -->
  <section id="setup">
    <p style="text-align:center;color:#fff;font-weight:bold;">เลือกแบบโจทย์</p>
    <div class="option-row" id="opRow"></div>

    <p style="text-align:center;color:#fff;font-weight:bold;">ระดับความยาก</p>
    <div class="option-row" id="levelRow"></div>

    <div style="text-align:center;">
      <button class="btn" id="startBtn">▶ เริ่มเล่น</button>
    </div>
    <p class="message" id="bestText" style="font-size:1rem;"></p>
  </section>

  <!-- ===== หน้าเล่น ===== -->
  <section id="play" style="display:none;flex-direction:column;align-items:center;width:100%;">
    <div class="status-bar">
      <span>⭐ คะแนน: <span id="score">0</span></span>
      <span>🔥 ต่อเนื่อง: <span id="streak">0</span></span>
      <span class="hearts" id="hearts">❤️❤️❤️</span>
    </div>

    <div class="math-box">
      <div class="question" id="question">? + ? = ?</div>
      <div class="timer-ring"><i id="timerBar"></i></div>
      <div class="choices" id="choices"></div>
    </div>

    <p class="message" id="message"></p>
    <button class="btn btn-ghost" id="quitBtn" style="margin-top:8px;">⚙️ เปลี่ยนระดับ</button>
  </section>

  <!-- ===== ผลลัพธ์ ===== -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-emoji" id="modalEmoji">🎉</div>
      <h2 id="modalTitle">จบเกม!</h2>
      <p id="modalText"></p>
      <div class="modal-stars" id="modalStars"></div>
      <div class="modal-buttons">
        <button class="btn" id="againBtn">🔄 เล่นอีก</button>
        <button class="btn btn-ghost" id="menuBtn">⚙️ เปลี่ยนระดับ</button>
      </div>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/math.js"></script>
</body>
</html>
